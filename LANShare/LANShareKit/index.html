<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Share</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e6e8ec;
    --accent: #2563eb; --accent-soft: #2563eb14; --ok: #16a34a; --err: #dc2626;
    --shadow: 0 1px 2px #0000000a, 0 4px 16px #0000000a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #9aa1ad; --line: #272b33;
      --accent: #5b8cff; --accent-soft: #5b8cff1f; --ok: #34d399; --err: #f87171;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; color: #fff; flex: none; }
  header h1 { font-size: 20px; margin: 0; line-height: 1.2; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.on::before { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  .status.off::before { background: var(--err); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }

  #drop {
    display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
    padding: 40px 16px; cursor: pointer; border: 2px dashed var(--line); transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop:focus-within, body.dragging #drop { border-color: var(--accent); background: var(--accent-soft); }
  #drop .icon { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 4px; }
  #drop strong { font-size: 17px; }
  #drop span:not(.btn) { color: var(--muted); font-size: 14px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; padding: 8px 18px; margin-top: 8px;
  }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 4px 8px; display: flex; justify-content: space-between; }
  ul { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .row + .row { border-top: 1px solid var(--line); }
  .badge {
    flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
    background: color-mix(in srgb, var(--c, var(--muted)) 15%, transparent); color: var(--c, var(--muted));
  }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .meta.ok { color: var(--ok); } .meta.err { color: var(--err); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 6px 0 4px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .2s; }
  .icon-btn {
    flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    color: var(--accent); background: var(--accent-soft); text-decoration: none;
  }
  .icon-btn:hover { background: var(--accent); color: #fff; }
  .empty { padding: 24px 16px; text-align: center; color: var(--muted); }
  #uploads:empty, #uploads-title:has(+ #uploads:empty) { display: none; }
  svg { display: block; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
    </div>
    <div>
      <h1>LAN Share</h1>
      <p>Gửi file từ máy tính sang điện thoại</p>
    </div>
    <div id="status" class="status" role="status">Đang kết nối…</div>
  </header>

  <label id="drop" class="card">
    <input id="picker" type="file" multiple hidden>
    <div class="icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg>
    </div>
    <strong>Kéo thả file vào đây</strong>
    <span>Hỗ trợ nhiều file cùng lúc, không giới hạn định dạng</span>
    <span class="btn">Chọn file</span>
  </label>

  <h2 id="uploads-title">Đang gửi</h2>
  <ul id="uploads" class="card"></ul>

  <h2><span>File trên điện thoại</span><span id="count"></span></h2>
  <ul id="files" class="card"><li class="empty">Đang tải…</li></ul>
</main>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
const api = (path, name) => `${path}?t=${encodeURIComponent(token)}` + (name ? `&name=${encodeURIComponent(name)}` : '');
const $ = id => document.getElementById(id);

const COLORS = {
  pdf: '#ef4444', doc: '#2563eb', docx: '#2563eb', xls: '#16a34a', xlsx: '#16a34a', csv: '#16a34a',
  ppt: '#ea580c', pptx: '#ea580c', jpg: '#a855f7', jpeg: '#a855f7', png: '#a855f7', heic: '#a855f7', gif: '#a855f7',
  mp4: '#db2777', mov: '#db2777', mp3: '#0891b2', zip: '#ca8a04', txt: '#64748b',
};
const DOWNLOAD_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12"/><path d="m6 10 6 6 6-6"/><path d="M4 20h16"/></svg>';

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text; // textContent, never innerHTML, for file names
  return e;
}

function badge(name) {
  const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : '';
  const b = el('div', 'badge', ext.slice(0, 4) || 'file');
  if (COLORS[ext]) b.style.setProperty('--c', COLORS[ext]);
  return b;
}

function sizeText(bytes) {
  const units = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return `${bytes.toFixed(i ? 1 : 0)} ${units[i]}`;
}

function setStatus(online) {
  $('status').className = 'status ' + (online ? 'on' : 'off');
  $('status').textContent = online ? 'Đã kết nối' : 'Mất kết nối';
}

async function refresh() {
  const list = $('files');
  try {
    const res = await fetch(api('/api/files'));
    if (!res.ok) throw new Error(res.status);
    const files = await res.json();
    setStatus(true);
    $('count').textContent = files.length ? `${files.length} file` : '';
    if (!files.length) { list.replaceChildren(el('li', 'empty', 'Chưa có file nào')); return; }
    list.replaceChildren(...files.map(f => {
      const li = el('li', 'row');
      const info = el('div', 'info');
      info.append(el('div', 'name', f.name), el('div', 'meta', sizeText(f.size)));
      const a = el('a', 'icon-btn');
      a.href = api('/api/file', f.name);
      a.title = a.ariaLabel = `Tải ${f.name}`;
      a.innerHTML = DOWNLOAD_ICON;
      li.append(badge(f.name), info, a);
      return li;
    }));
  } catch {
    setStatus(false);
    list.replaceChildren(el('li', 'empty', 'Không kết nối được tới điện thoại. Hãy mở app và giữ màn hình LAN Share.'));
  }
}

// Raw body upload (no multipart) so the phone can stream straight to disk.
// XHR instead of fetch: fetch can't report upload progress.
function upload(file) {
  const li = el('li', 'row');
  const info = el('div', 'info');
  const fill = el('div');
  const bar = el('div', 'bar');
  bar.append(fill);
  const meta = el('div', 'meta', `Đang chờ · ${sizeText(file.size)}`);
  info.append(el('div', 'name', file.name), bar, meta);
  li.append(badge(file.name), info);
  $('uploads').prepend(li);

  const finish = (ok, text) => {
    bar.remove();
    meta.className = 'meta ' + (ok ? 'ok' : 'err');
    meta.textContent = text;
  };

  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    const started = Date.now();
    xhr.open('PUT', api('/api/files', file.name));
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const pct = Math.round(e.loaded / e.total * 100);
      const speed = e.loaded / Math.max((Date.now() - started) / 1000, 0.1);
      fill.style.width = pct + '%';
      meta.textContent = `${pct}% · ${sizeText(e.loaded)} / ${sizeText(e.total)} · ${sizeText(speed)}/s`;
    };
    xhr.onload = () => { finish(xhr.status === 201, xhr.status === 201 ? `Đã gửi · ${sizeText(file.size)}` : `Lỗi ${xhr.status}`); resolve(); };
    xhr.onerror = () => { finish(false, 'Mất kết nối'); setStatus(false); resolve(); };
    xhr.send(file);
  });
}

async function uploadAll(files) {
  if (!files.length) return;
  for (const f of files) { await upload(f); refresh(); } // one at a time keeps the phone's memory/IO calm
}

$('picker').onchange = e => { uploadAll([...e.target.files]); e.target.value = ''; };

// Whole page is a drop target; counter avoids flicker when dragging over child elements.
let depth = 0;
addEventListener('dragenter', e => { e.preventDefault(); depth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--depth === 0) document.body.classList.remove('dragging'); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); depth = 0; document.body.classList.remove('dragging');
  uploadAll([...e.dataTransfer.files]);
});

refresh();
</script>
</body>
</html>
